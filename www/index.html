<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plex Media Hub</title>
<style>
:root{--bg:#0b0c0e;--card:#16181d;--text:#f0f2f5;--dim:#8c93a0;--accent:#e5a00d;--border:#262933}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
body{background:var(--bg);overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:24px}
.tab{background:none;border:none;font-size:16px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 0}
.tab.on{color:var(--text);border-bottom:2px solid var(--accent)}
.search{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim);font-size:14px}
.search svg{width:16px;height:16px;fill:currentColor}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:11px;cursor:pointer}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;fill:currentColor}
#view{padding-bottom:70px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px;cursor:pointer}
.hd h2{font-size:18px;font-weight:700}
.hd svg{width:18px;height:18px;fill:var(--dim)}
.row{display:flex;gap:14px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.wide{flex:0 0 260px}
.tall{flex:0 0 130px}
.art{width:100%;aspect-ratio:2/3;background:var(--card);border-radius:8px;position:relative;overflow:hidden;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px}
.wide .art{aspect-ratio:16/9}
.art b{font-size:12px;color:var(--dim)}
.bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,0.2)}
.bar i{display:block;height:100%;background:var(--accent)}
.cap{font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad{background:var(--card);margin:20px;padding:20px;border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;position:relative}
.ad span{font-size:12px;color:var(--dim)}
.ad em{font-size:22px;font-weight:800;color:var(--accent);font-style:normal}
.ad u{font-size:13px;text-decoration:none;font-weight:600}
.ad small{position:absolute;top:12px;right:12px;font-size:10px;background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;color:var(--dim)}
#sub{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding-bottom:40px}
.subhd{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.subhd h2{font-size:18px}
.back{background:none;border:none;cursor:pointer;padding:4px}
.back svg{width:22px;height:22px;fill:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;padding:20px}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.more{display:block;margin:20px auto;background:var(--card);border:1px solid var(--border);padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer}
.note{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px}
.empty{padding:60px 20px;text-align:center;color:var(--dim)}
#q{width:100%;background:none;border:none;font-size:16px;outline:none}
.addons{padding:20px}
.pg{font-size:22px;font-weight:700;margin-bottom:16px}
.sh{font-size:16px;font-weight:600;margin:24px 0 12px;color:var(--dim)}
.ai{background:var(--card);border:1px solid var(--border);padding:14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ai div{display:flex;flex-direction:column;gap:2px}
.ai b{font-size:14px}
.ai small{color:var(--dim);font-size:12px}
.rm{background:none;border:1px solid var(--border);color:#ff4d4d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.addrow{display:flex;gap:10px;margin-top:10px}
.addrow input{flex:1;background:var(--card);border:1px solid var(--border);padding:10px;border-radius:8px;font-size:14px;outline:none}
.addrow button{background:var(--accent);color:#000;border:none;padding:0 16px;border-radius:8px;font-weight:600;cursor:pointer}
.note2{font-size:13px;color:var(--dim);margin-top:8px}
.tp{position:relative}
.tpart{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;position:relative}
.tpart::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent)}
.tpin{padding:0 20px;margin-top:-30px;position:relative;z-index:2}
.tpin h2{font-size:24px;margin-bottom:6px}
.meta{font-size:13px;color:var(--dim);margin-bottom:6px}
.gn{font-size:13px;color:var(--dim);margin-bottom:14px}
.play{width:100%;background:var(--accent);color:#000;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:10px}
.add{width:100%;background:var(--card);border:1px solid var(--border);padding:10px;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:16px}
.syn{font-size:14px;line-height:1.5;color:var(--dim);margin-bottom:20px}
.seas{display:flex;gap:8px;overflow-x:auto;padding:0 20px 14px;scrollbar-width:none}
.seas::-webkit-scrollbar{display:none}
.sbtn{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--dim)}
.sbtn.on{background:var(--accent);color:#000;border-color:var(--accent)}
.ep{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer}
.epn{font-size:16px;font-weight:700;color:var(--dim);width:24px;text-align:center}
.ept{flex:1}
.ept b{font-size:14px;display:block;margin-bottom:2px}
.ept small{font-size:12px;color:var(--dim)}
#player{position:fixed;inset:0;background:#000;z-index:300;display:flex;align-items:center;justify-content:center}
#player video{width:100%;height:100%;max-height:100vh}
.pclose{position:absolute;top:20px;right:20px;background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:32px;width:44px;height:44px;border-radius:22px;cursor:pointer;z-index:310;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(22,24,29,0.95);border:1px solid var(--border);padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;animation:fadeInOut 2.6s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
</style>
</head>
<body>

<header>
  <div class="tabs" id="tabs">
    <button class="tab on">Home</button>
    <button class="tab">Movies</button>
    <button class="tab">TV Shows</button>
  </div>
  <div class="search" role="button" tabindex="0">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    Search
  </div>
</header>

<div id="view"></div>

<div class="nav" id="nav">
  <button data-l="Home" class="on"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</button>
  <button data-l="Discover"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>Discover</button>
  <button data-l="My List"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>My List</button>
  <button data-l="More"><svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.03 2.18 13.82 2 13.6 2h-4c-.22 0-.43.18-.47.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.47.42h4c.22 0 .43-.18.47-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>Settings</button>
</div>

<div id="sub" hidden></div>

<script>
var arrow='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
var cont=[["Night Signal",'g1',62],["Harbor Lights S1E1",'g2',30]];
var movies=[["Night Signal",'g1'],["Hollow Road",'g3'],["The End of Elm Lane",'g4'],["Golden Hour",'g8']];
var shows=[["Sunday Kitchen",'g5'],["The Orchard",'g6'],["Reach",'g7'],["Paper Moons",'g2']];
function hd(t){return '<div class="hd" role="button" tabindex="0" data-t="'+esc(t)+'"><h2>'+esc(t)+'</h2>'+arrow+'</div>'}
function safe(u){return /^https?:\/\//.test(u||'')?u.replace(/['"()\s<>]/g,function(c){return '%'+c.charCodeAt(0).toString(16)}):''}
function bg(a){return safe(a[3])?' style="background:#111 url('+safe(a[3])+') center/cover"':''}
function lab(a){return safe(a[3])?'':'<b>'+esc(a[0]).toUpperCase()+'</b>'}
function wide(a){return '<div class="wide"><div class="art '+a[1]+'"'+kk(a)+' tabindex="0"'+bg(a)+'>'+lab(a)+'<div class="bar"><i style="width:'+a[2]+'%"></i></div></div><div class="cap">'+a[0]+'</div></div>'}
function tall(a){return '<div class="tall"><div class="art '+a[1]+'"'+kk(a)+' tabindex="0"'+bg(a)+'>'+lab(a)+'</div><div class="cap">'+a[0]+'</div></div>'}
var most=[["Iron Throne",'g3'],["Dark Frontier",'g1'],["The Vault Job",'g5'],["Harbor Lights",'g2']];
var topRated=[["Teach the Class",'g7'],["Cattle Country",'g6'],["Perfect Crown",'g8'],["Long Winter",'g4']];
var kids=[["Bubble Kingdom",'g8'],["Little Comet",'g7'],["Fox and Fern",'g6'],["Sea Song",'g4']];
function sec(t,l){return hd(t)+'<div class="row">'+l.map(tall).join('')+'</div>'}
function ad(){return '<div class="ad"><span>Shop more, save massive!</span><em>90% OFF</em><u>Shop now</u><small>Ad</small></div>'}
function home(){if(plexOnly())return plexHome();return hd('Continue Watching')+'<div class="row">'+cont.map(wide).join('')+'</div>'+prows()+sec('2026 Movies',movies)+sec('Popular TV Shows',shows)+sec('Most Watched TV Shows',most)+ad()+sec('Top Rated TV Shows Of All Time',topRated)+sec('2026 Kids & Family Films',kids)+arows()}
function movs(){if(plexOnly())return plexHome('movie');return prows('movie')+sec('2026 Movies',movies)+sec('2026 Kids & Family Films',kids)+arows('movie')}
function tv(){if(plexOnly())return plexHome('series');return prows('series')+sec('Popular TV Shows',shows)+sec('Most Watched TV Shows',most)+ad()+sec('Top Rated TV Shows Of All Time',topRated)+arows('series')}
function none(t){return '<div class="empty">'+t+' is empty for now. Titles you add will show up here.</div>'}
var views={Home:home,Movies:movs,"TV Shows":tv};
var v=document.getElementById('view');
var ADD=null,AROWS=[],ARMAP={},PL=null,PXON=false,PROWS=[],TP=null,LIST=[],PXST=0,POOL=[];
function show(n){v.innerHTML=views[n]()}
show('Home');
var KEY='';try{KEY=localStorage.getItem('plexmediahub.tmdb')||''}catch(e){}
KEY=KEY||'PASTE_YOUR_TMDB_KEY_HERE';
function api(p){var h={},u='https://api.themoviedb.org/3'+p;if(KEY.length>40)h.Authorization='Bearer '+KEY;else u+=(p.indexOf('?')>-1?'&':'?')+'api_key='+KEY;return fetch(u,{headers:h}).then(function(r){return r.json()})}
var GN={28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Science Fiction',53:'Thriller',10752:'War',37:'Western',10765:'Sci-Fi & Fantasy',10759:'Action & Adventure'};
function load(){
  if(!KEY||KEY.indexOf('PASTE')===0)return;
  var I='https://image.tmdb.org/t/p/';
  function mp(r,f,g){return (r.results || []).filter(function(x){return x.poster_path}).slice(0,12).map(function(x){return [x.title||x.name,g,0,I+'w500'+x.poster_path,(x.genre_ids||[]).slice(0,3).map(function(i){return GN[i]}).filter(Boolean).join(' \u2022 ')]})}
  
  Promise.all([
    api('/discover/movie?primary_release_year=2026&sort_by=vote_average.desc&vote_count.gte=1'),
    api('/tv/popular'),
    api('/trending/tv/week'),
    api('/tv/top_rated'),
    api('/discover/movie?primary_release_year=2026&with_genres=10751')
  ]).then(function(r){
    movies=mp(r[0],0,'g1');shows=mp(r[1],0,'g5');most=mp(r[2],0,'g3');topRated=mp(r[3],0,'g7');kids=mp(r[4],0,'g8');
    if(!PXON)cont=r[0].results.filter(function(x){return x.backdrop_path}).slice(0,2).map(function(x,i){return [x.title,'g1',[62,30][i],I+'w780'+x.backdrop_path]});
    rerender();
  }).catch(function(){});
}
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
  b.classList.add('on');document.querySelectorAll('.nav button').forEach(function(t){t.classList.toggle('on',t.dataset.l==='Home')});show(b.textContent);
});
document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.nav button').forEach(function(t){t.classList.remove('on')});
  b.classList.add('on');
  var l=b.dataset.l;closeSub();
  if(l==='Home')show(document.querySelector('.tab.on').textContent);else if(l==='More')v.innerHTML=addonsPage();else if(l==='My List')v.innerHTML=listPage();else if(l==='Discover')v.innerHTML=discoverPage();else v.innerHTML=none(l);
});

var IMG='https://image.tmdb.org/t/p/';
var EP={'2026 Movies':'/discover/movie?primary_release_year=2026&sort_by=popularity.desc','Popular TV Shows':'/tv/popular','Most Watched TV Shows':'/trending/tv/week','Top Rated TV Shows Of All Time':'/tv/top_rated','2026 Kids & Family Films':'/discover/movie?primary_release_year=2026&with_genres=10751'};
function LST(t){return {'Continue Watching':cont,'2026 Movies':movies,'Popular TV Shows':shows,'Most Watched TV Shows':most,'Top Rated TV Shows Of All Time':topRated,'2026 Kids & Family Films':kids}[t]||[]}
function hasKey(){return !!KEY&&KEY.indexOf('PASTE')!==0}
function esc(s){return s.replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function mk(r,g){return (r.results||[]).filter(function(x){return x.poster_path&&x.media_type!=='person'}).map(function(x){return [x.title||x.name,g,0,IMG+'w500'+x.poster_path]})}
var sub=document.getElementById('sub'),moreFn=null,qTok=0;
var BACK='<button class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>';
function openSub(h){sub.innerHTML='<div class="subin">'+h+'</div>';sub.hidden=false}
function closeSub(){sub.hidden=true;sub.innerHTML='';moreFn=null;qTok++}
function openSection(t){
  var ar=ARMAP[t],items=(ar?ar.items:LST(t)).slice(),page=1,ep=EP[t],wm=t==='Continue Watching',canMore=(ep&&hasKey())||(ar&&(ar.more||ex(ar.c).indexOf('skip')>=0));
  function draw(){
    var y=sub.scrollTop;
    openSub('<div class="subhd">'+BACK+'<h2>'+esc(t)+'</h2></div><div class="grid'+(wm?' w':'')+'">'+items.map(wm?wide:tall).join('')+'</div>'+(canMore?'<button class="more">Load more</button>':'')+(!hasKey()&&!ar?'<p class="note">Add your TMDB key to load the full list.</p>':''));
    sub.scrollTop=y;
  }
  moreFn=function(){
    page++;var bt=sub.querySelector('.more');if(bt){bt.textContent='Loading...';bt.disabled=true}
    var p=ar?(ar.more?ar.more(items.length):fetchJ(acat(ar.a,ar.c,'skip='+items.length)).then(toItems)):api(ep+(ep.indexOf('?')>-1?'&':'?')+'page='+page).then(function(r){return mk(r,'g1')});
    p.then(function(n){
      var seen={};items.forEach(function(x){seen[x[0]+x[3]]=1});
      n=n.filter(function(x){return !seen[x[0]+x[3]]});if(!n.length)canMore=false;
      items=items.concat(n);draw();
    }).catch(function(){draw()});
  };
  draw();sub.scrollTop=0;
}
function showRes(items,q){var r=document.getElementById('res');if(!r)return;r.innerHTML=items.length?'<div class="grid">'+items.map(tall).join('')+'</div>':'<p class="note">No results for \u201C'+esc(q)+'\u201D.</p>'}
function run(q){
  var tok=++qTok,r=document.getElementById('res');
  if(!q){if(r)r.innerHTML='<p class="note">Type a title to start searching.</p>';return}
  var ps=[plexSearch(q)];
  if(hasKey())ps.push(api('/search/multi?query='+encodeURIComponent(q)).then(function(x){return mk(x,'g1')}).catch(function(){return []}));
  else{var lq=q.toLowerCase();ps.push(Promise.resolve([].concat(movies,shows,most,topRated,kids).filter(function(a){return a[0].toLowerCase().indexOf(lq)>=0})))}
  ADD.forEach(function(a){searchCats(a).forEach(function(c){ps.push(fetchJ(acat(a,c,'search='+encodeURIComponent(q))).then(toItems).catch(function(){return []}))})});
  Promise.all(plexOnly()?[ps[0]]:ps).then(function(g){if(tok!==qTok)return;var seen={};showRes([].concat.apply([],g).filter(function(a){var k=a[0].toLowerCase();if(seen[k])return false;seen[k]=1;return true}),q)});
}
function openSearch(){
  openSub('<div class="subhd">'+BACK+'<input id="q" type="search" placeholder="Search movies and shows" autocomplete="off" aria-label="Search"></div><div id="res"><p class="note">Type a title to start searching.</p></div>');
  var q=document.getElementById('q'),tm;q.focus();
  q.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){run(q.value.trim())},300)});
}
sub.addEventListener('click',function(e){if(e.target.closest('.back'))closeSub();else if(e.target.closest('.more')&&moreFn)moreFn()});
v.addEventListener('click',function(e){var h=e.target.closest('.hd');if(h)openSection(h.dataset.t)});
v.addEventListener('keydown',function(e){var h=e.target.closest('.hd');if(h&&e.key==='Enter')openSection(h.dataset.t)});
var sb=document.querySelector('.search');sb.addEventListener('click',openSearch);sb.addEventListener('keydown',function(e){if(e.key==='Enter')openSearch()});

try{ADD=JSON.parse(localStorage.getItem('plexmediahub.addons')||'null')}catch(e){}
if(!Array.isArray(ADD))ADD=[{url:'https://v3-cinemeta.strem.io/manifest.json',manifest:{id:'com.linvo.cinemeta',name:'Cinemeta',version:'3',description:'Movie and series catalogs',catalogs:[{type:'movie',id:'top',name:'Popular',extra:[{name:'search'},{name:'skip'}]},{type:'series',id:'top',name:'Popular',extra:[{name:'search'},{name:'skip'}]}]}}];
function store(){try{localStorage.setItem('plexmediahub.addons',JSON.stringify(ADD))}catch(e){}}
function fetchJ(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
function abase(a){return a.url.replace(/\/manifest\.json.*$/,'')}
function acat(a,c,e){return abase(a)+'/catalog/'+encodeURIComponent(c.type)+'/'+encodeURIComponent(c.id)+(e?'/'+e:'')+'.json'}
function ex(c){return (c.extra||[]).map(function(e){return e.name}).concat(c.extraSupported||[])}
function cats(a){return (a.manifest.catalogs||[]).filter(function(c){return c.type&&c.id&&!(c.extra||[]).some(function(e){return e.isRequired})&&!(c.extraRequired||[]).length}).slice(0,4)}
function searchCats(a){return (a.manifest.catalogs||[]).filter(function(c){return c.type&&c.id&&ex(c).indexOf('search')>=0&&!(c.extra||[]).some(function(e){return e.isRequired&&e.name!=='search'})&&!(c.extraRequired||[]).some(function(n){return n!=='search'})}).slice(0,3)}

function tryConn(d,cs,i){

function plexPick(tok){

    var ds=rs.filter(function(d){return (d.provides||'').indexOf('server')>=0&&d.accessToken}).sort(function(a,b){return (b.owned?1:0)-(a.owned?1:0)});

    return tryConn(d,cs,0).then(function(uri){
      PL={token:tok,server:{name:d.name,uri:uri.replace(/\/$/,''),token:d.accessToken}};
      try{localStorage.setItem('plexmediahub.plex',JSON.stringify(PL))}catch(e){}

    jobs.push(pget('/library/onDeck').then(function(x){return {od:(x.MediaContainer.Metadata||[]).map(function(m){return pitem(m,true)})}}).catch(function(){return null}));

function move(dir){
  var list=focusables(),cur=document.activeElement,navEl=document.getElementById('nav');
  var inNav=function(e){return navEl.contains(e)};
  if(!cur||list.indexOf(cur)<0){var f=list.filter(function(e){return !inNav(e)&&e.closest('.hcard,.row,.grid')})[0]||list[0];if(f)f.focus();return}
  var c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2,best=null,bs=1e9,fromNav=inNav(cur);
  var navTop=navEl.getBoundingClientRect().top;
  list.forEach(function(e){
    if(e===cur||inNav(e))return;
    var r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy,d,p;
    if(fromNav){if(dir!=='U')return;if(r.bottom>navTop||r.bottom<0)return;d=navTop-r.bottom;p=Math.abs(dx)}
    else if(dir==='L'&&dx<-2){d=-dx;p=Math.abs(dy)}else if(dir==='R'&&dx>2){d=dx;p=Math.abs(dy)}else if(dir==='U'&&dy<-2){d=-dy;p=Math.abs(dx)}else if(dir==='D'&&dy>2){d=dy;p=Math.abs(dx)}else return;
    var sc=d+p*3;if(sc<bs){bs=sc;best=e}
  });
  if(fromNav&&(dir==='L'||dir==='R')){
    var nb=Array.prototype.slice.call(navEl.querySelectorAll('button')),i=nb.indexOf(cur)+(dir==='R'?1:-1);
    if(nb[i])nb[i].focus();return;
  }
  if(!best&&!fromNav&&dir==='D'){var nbtn=navEl.querySelector('button.on')||navEl.querySelector('button');if(nbtn)nbtn.focus();return}

    var vv=PT.v;
    if(k==='Enter'||k===' '||k==='MediaPlayPause'){e.preventDefault();if(vv.paused)vv.play();else vv.pause();return}
    if(k==='ArrowLeft'||k==='MediaRewind'){e.preventDefault();vv.currentTime=Math.max(0,vv.currentTime-10);return}
    if(k==='ArrowRight'||k==='MediaFastForward'){e.preventDefault();vv.currentTime=vv.currentTime+10;return}
    return;
  }
  var dir={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[k];
  if(dir){if(t&&t.tagName==='INPUT'&&(dir==='L'||dir==='R'))return;e.preventDefault();move(dir);return}
  if((k==='Enter'||e.keyCode===23)&&t&&t.matches&&t.matches('.art,.ep')){e.preventDefault();t.click()}
});
try{
  var CAP=window.Capacitor,APP=CAP&&CAP.Plugins&&CAP.Plugins.App;
  if(APP)APP.addListener('backButton',function(){
    if(PT){closePlayer();return}
    if(!sub.hidden){closeSub();return}
    var n=document.querySelector('.nav button.on');
    if(n&&n.dataset.l!=='Home'){document.querySelector('.nav button[data-l="Home"]').click();return}
    var t=document.querySelector('.tab.on');
    if(t&&t.textContent!=='Home'){document.querySelector('.tab').click();return}
    APP.exitApp();
  });
}catch(e){}
</script>
