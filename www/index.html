<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex 2026 Dashboard</title>
    <style>
        :root {
            --bg-color: #141414;
            --text-color: #ffffff;
            --plex-orange: #e5a00d;
            --card-bg: #1f1f1f;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }
        h1.logo {
            color: var(--plex-orange);
            margin: 0;
            font-size: 24px;
        }
        #status-msg {
            font-size: 14px;
            color: #aaa;
        }
        .hero {
            height: 70vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 50px 40px;
            position: relative;
            background-image: linear-gradient(to top, var(--bg-color), rgba(20,20,20,0)), url('');
        }
        .hero-content {
            max-width: 600px;
            z-index: 2;
        }
        .hero-content h2 {
            font-size: 48px;
            margin: 0 0 10px 0;
        }
        .hero-content p {
            font-size: 16px;
            color: #ddd;
            margin-bottom: 20px;
        }
        .container {
            padding: 20px 40px;
        }
        .row-title {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .row-items {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 20px;
            scrollbar-width: none;
        }
        .row-items::-webkit-scrollbar {
            display: none;
        }
        .card {
            flex: 0 0 200px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .card-title {
            padding: 10px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">Plex 2026 Hub</h1>
        <div id="status-msg">Connecting to Plex...</div>
    </header>

    <div id="hero-section" class="hero">
        <div class="hero-content">
            <h2 id="hero-title">Loading...</h2>
            <p id="hero-desc">Checking your Plex library for 2026 releases.</p>
        </div>
    </div>

    <div class="container" id="rows-container">
        <!-- Dynamic Plex rows injected here -->
    </div>

    <script>
        // Global variables for Plex connection and state
        var PL = true; // Assume Plex is configured
        var PROWS = [];
        var POOL = [];
        var ARMAP = {};
        var PXST = 0;
        var PXON = false;
        var HERO = [];

        // Mock helper functions (Replace or map to your existing environment functions)
        function pget(endpoint, params) {
            return fetch(endpoint + (params ? '?' + params : '')).then(res => res.json());
        }

        function pitem(m, isOnDeck) {
            return {
                title: m.title,
                year: m.year,
                thumb: m.thumb ? ('/photo/:/transcode?width=400&height=600&url=' + encodeURIComponent(m.thumb)) : '',
                summary: m.summary || ''
            };
        }

        function heroItem(m) {
            return {
                title: m.title,
                summary: m.summary,
                thumb: m.thumb
            };
        }

        function mkTop(title, type, items) {
            return {
                t: title,
                items: items.map(m => pitem(m))
            };
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function pmsg(msg) {
            document.getElementById('status-msg').innerText = msg;
        }

        function rerender() {
            // Render Hero
            if (HERO.length > 0) {
                document.getElementById('hero-title').innerText = HERO[0].title;
                document.getElementById('hero-desc').innerText = HERO[0].summary;
                document.getElementById('hero-section').style.backgroundImage = 'linear-gradient(to top, var(--bg-color), rgba(20,20,20,0)), url(' + HERO[0].thumb + ')';
            }

            // Render Rows
            var container = document.getElementById('rows-container');
            container.innerHTML = '';
            PROWS.forEach(row => {
                var rowDiv = document.createElement('div');
                rowDiv.innerHTML = `
                    <div class="row-title">${row.t}</div>
                    <div class="row-items">
                        ${row.items.map(item => `
                            <div class="card">
                                <img src="${item.thumb}" alt="${item.title}">
                                <div class="card-title">${item.title}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(rowDiv);
            });
        }

        // --- Main Plex Loading Function with Dynamic 2026 Filter ---
        function loadPlex(){
            if(!PL) return;
            pget('/library/sections').then(function(r){
                var ds = (r.MediaContainer.Directory || []).filter(function(d){ return d.type === 'movie' || d.type === 'show'; });
                var jobs = ds.map(function(d){ 
                    return pget('/library/sections/' + d.key + '/all', 'sort=addedAt:desc&X-Plex-Container-Start=0&X-Plex-Container-Size=30')
                        .then(function(x){ return {d: d, raw: x.MediaContainer.Metadata || [], items: (x.MediaContainer.Metadata || []).map(function(m){ return pitem(m); })}; })
                        .catch(function(){ return null; }); 
                });
                ds.forEach(function(d){ 
                    jobs.push(pget('/library/sections/' + d.key + '/all', 'X-Plex-Container-Start=0&X-Plex-Container-Size=150')
                        .then(function(x){ return {pool: x.MediaContainer.Metadata || []}; })
                        .catch(function(){ return null; })); 
                });
                jobs.push(pget('/library/onDeck').then(function(x){ return {od: (x.MediaContainer.Metadata || []).map(function(m){ return pitem(m, true); })}; }).catch(function(){ return null; }));
                return Promise.all(jobs);
            }).then(function(rs){
                PROWS = []; var POOLR = [];
                rs.forEach(function(x){
                    if(!x) return;
                    if(x.pool){ POOLR = POOLR.concat(x.pool); return; }
                    if(x.od){ if(x.od.length){ cont = x.od; PXON = true; } return; }
                    if(!x.items.length) return;
                    var d = x.d, t = d.title + ' on Plex';
                    var row = {
                        t: t, 
                        items: x.items, 
                        c: {type: d.type === 'movie' ? 'movie' : 'series'}, 
                        more: function(n){ 
                            return pget('/library/sections/' + d.key + '/all', 'sort=addedAt:desc&X-Plex-Container-Start=' + n + '&X-Plex-Container-Size=30')
                                .then(function(y){ return (y.MediaContainer.Metadata || []).map(function(m){ return pitem(m); }); }); 
                        }
                    };
                    PROWS.push(row); ARMAP[t] = row;
                });
                var mv = POOLR.filter(function(m){ return m.type === 'movie'; }), sh = POOLR.filter(function(m){ return m.type === 'show'; });
                POOL = POOLR.filter(function(m){ return m.thumb && (m.type === 'movie' || m.type === 'show'); }).map(function(m){ return pitem(m); });
                
                // Dynamically filter your Plex movies for the year 2026
                var movies2026 = mv.filter(function(m){ return m.year === 2026 && m.thumb; });
                if(movies2026.length > 0) {
                    HERO = movies2026.slice(0, 5).map(heroItem);
                } else {
                    var hp = shuffle(mv.filter(function(m){ return m.thumb; })).slice(0, 5);
                    if(!hp.length) hp = shuffle(sh.filter(function(m){ return m.thumb; })).slice(0, 5);
                    if(hp.length) HERO = hp.map(heroItem);
                }

                var tops = [];
                if(movies2026.length) tops.push(mkTop('Top 2026 Movies on Plex', 'movie', movies2026));
                if(mv.length) tops.push(mkTop('Top Picks: Movies', 'movie', shuffle(mv).slice(0, 15)));
                if(sh.length) tops.push(mkTop('Top Picks: Shows', 'series', shuffle(sh).slice(0, 15)));
                PROWS = tops.concat(PROWS); tops.forEach(function(r){ ARMAP[r.t] = r; });
                PXST = 1; pmsg(PROWS.length ? 'Your Plex libraries are loaded.' : 'Connected, but no libraries found.');
                rerender();
            }).catch(function(){ PXST = 2; pmsg('Could not load your Plex libraries.'); rerender(); });
        }

        // --- Automatic Update Checker Logic ---
        var CURRENT_VERSION_CODE = 1; // Change this number only when releasing a new APK build

        function checkForAppUpdates() {
            var versionFileUrl = 'https://raw.githubusercontent.com/Awmedia21/Media/main/version.json';

            fetch(versionFileUrl + '?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    if (data.versionCode > CURRENT_VERSION_CODE) {
                        showUpdateModal(data.versionName, data.apkUrl);
                    }
                })
                .catch(err => console.log('Update check failed', err));
        }

        function showUpdateModal(versionName, apkUrl) {
            var modal = document.createElement('div');
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; justify-content:center; align-items:center;';
            modal.innerHTML = `
                <div style="background:#1f1f1f; padding:30px; border-radius:12px; max-width:400px; text-align:center; color:#fff; font-family:sans-serif;">
                    <h3 style="margin-top:0; color:#e5a00d;">Update Available (v${versionName})</h3>
                    <p style="color:#ccc; font-size:14px;">A new version of the app is available.</p>
                    <a href="${apkUrl}" style="display:inline-block; background:#e5a00d; color:#000; padding:12px 24px; border-radius:6px; text-decoration:none; font-weight:bold; margin-top:15px;">Download Update</a>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Initialize on load
        window.onload = function() {
            loadPlex();
            setTimeout(checkForAppUpdates, 3000); // Check for updates 3 seconds after opening
        };
    </script>
</body>
</html>
