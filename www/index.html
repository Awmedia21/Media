<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plex Media Hub</title>
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--bg:#121212;--fg:#fff;--muted:#99aabb;--card:#1c1e21;--pill:#282a2d;--accent:#e5a00d;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:var(--sat)}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:20}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Open Sans","Roboto","Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;padding:var(--sat) 0 100px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}
.logo{height:38px;width:auto}
.top .search{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;cursor:pointer}
.tabs{display:flex;gap:26px;padding:14px 20px 0;position:sticky;top:var(--sat);background:var(--bg);z-index:5;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.07)}
.tab{background:none;border:0;color:var(--muted);font-family:inherit;font-weight:600;font-size:17px;padding:8px 0 10px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--accent)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:24px 20px 10px;cursor:pointer}
.hd h2{margin:0;font-size:21px;font-weight:700}
.hd svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 20px 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.wide,.tall{flex:0 0 42%;width:42%;min-width:0;max-width:190px}
.art{position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;cursor:pointer;aspect-ratio:2/3;border-radius:6px;background:var(--card);transition:transform .15s}
.art:active{transform:scale(.97)}
.art b{font-size:20px;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.6);font-family:Impact,"Arial Narrow",sans-serif;font-weight:400}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:var(--accent)}
.unw{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 28px 28px 0;border-color:transparent var(--accent) transparent transparent;pointer-events:none}
.cap{margin:8px 2px 0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr{margin:1px 2px 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1f2326;border-top:1px solid rgba(255,255,255,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.nav button{flex:1;background:none;border:0;color:var(--muted);border-radius:6px;padding:8px 0 6px;font-family:inherit;font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav button.on{color:var(--accent)}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .on svg{fill:currentColor}
#sub{position:fixed;inset:0;background:var(--bg);z-index:8;overflow-y:auto;padding:calc(var(--sat) + 8px) 0 100px}
.subin{max-width:480px;margin:0 auto}
.subhd{display:flex;align-items:center;gap:6px;padding:8px 14px 16px}
.subhd h2{margin:0;font-size:22px}
.back{background:none;border:0;padding:6px;cursor:pointer;color:#fff;flex:none}
.back svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.subhd input{flex:1;min-width:0;background:#1f2326;border:0;color:#fff;border-radius:6px;padding:13px 14px;font-size:17px;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;padding:0 16px}
.grid .tall,.grid .wide{width:auto;max-width:none}
.grid .cap{font-size:13px}.grid .yr{font-size:12px}
.more{display:block;margin:24px auto 0;padding:12px 30px;border-radius:6px;border:0;background:var(--pill);color:#fff;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}
.note{padding:30px 20px;text-align:center;color:var(--muted);font-size:16px;margin:0}
.addons{padding:24px 20px}
.pg{margin:0 0 8px;font-size:26px}
.note2{color:var(--muted);font-size:15px;margin:6px 0 14px;line-height:1.4}
.addrow{display:flex;gap:8px}
.addrow button{border:0;border-radius:6px;background:var(--accent);color:#121212;font-weight:700;font-size:15px;font-family:inherit;padding:12px 20px;cursor:pointer}
.sh{margin:22px 0 6px;font-size:18px}
.tp{position:relative}
.tpart{height:220px;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.tpin{padding:0 20px;margin-top:-60px;position:relative}
.tpin h2{margin:0 0 6px;font-size:26px}
.meta{color:#ccc;font-size:14px;margin-bottom:6px}
.gn{color:var(--muted);font-size:14px;margin:0 0 14px}
.play,.add{height:48px;border:0;border-radius:6px;font-weight:700;font-size:16px;font-family:inherit;padding:0 22px;margin:0 8px 8px 0;cursor:pointer}
.play{background:var(--accent);color:#121212}.add{background:var(--pill);color:#fff}
.syn{color:#ddd;line-height:1.55;font-size:15px}
.seas{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 8px}
.sbtn{background:#1f2326;border:0;color:#fff;border-radius:6px;padding:8px 16px;white-space:nowrap;font-family:inherit;font-size:15px;cursor:pointer}
.sbtn.on{background:var(--accent);color:#121212}
.ep{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer}
.epn{width:26px;color:var(--muted);font-size:18px}
.ept{flex:1;min-width:0}.ept b{display:block;font-size:16px}.ept small{color:var(--muted)}
#player{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center}
#player video{width:100%;max-height:100%}
.pclose{position:absolute;top:calc(var(--sat) + 10px);left:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--pill);color:#fff;padding:12px 18px;border-radius:6px;z-index:40;font-size:15px}
.empty{padding:80px 30px;text-align:center;color:var(--muted);font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.art:focus-visible,.ep:focus-visible,.hd:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.art:focus-visible{transform:scale(1.04)}
@media (min-width:900px){
.app{max-width:none}
.top{padding:28px 48px 0}.logo{height:46px}.top .search{width:40px;height:40px}
.tabs{padding:18px 48px 0}
.hd{padding:28px 48px 12px}
.row{padding:0 48px 6px;gap:18px}
.wide,.tall{flex:0 0 180px;width:180px;max-width:none}
.subin{max-width:1200px}
.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));padding:0 48px;gap:22px 18px}
.grid .cap{font-size:15px}
.addons{max-width:900px;margin:0 auto;padding:30px 48px}
.tpart{height:340px}.tpin{padding:0 48px}
.seas,.ep{padding-left:48px;padding-right:48px}
#player video{height:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="top"><svg class="logo" viewBox="0 0 218 40" role="img" aria-label="Plex Media Hub"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5a00d"/><stop offset="1" stop-color="#cc8800"/></linearGradient></defs><rect width="40" height="40" rx="6" fill="url(#lg)"/><text x="20" y="26.5" fill="#121212" text-anchor="middle" font-family="'Arial Black','Trebuchet MS',Arial,sans-serif" font-size="14.5" font-weight="900" letter-spacing="-.5">PMH</text><path d="M9 33q2.75-3 5.5 0t5.5 0t5.5 0t5.5 0" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round" opacity=".7"/><text x="50" y="27" fill="#fff" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="-.5">Plex Media Hub</text></svg><svg class="search" role="button" tabindex="0" viewBox="0 0 24 24" aria-label="Search"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg></div>
  <div class="tabs" id="tabs"><button class="tab on">Home</button><button class="tab">Movies</button><button class="tab">TV Shows</button></div>
  <div id="view"></div>
</div>
<div id="sub" hidden></div>
<nav class="nav" id="nav">
  <button class="on" data-l="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-l="Discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</button>
  <button data-l="My List"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My List</button>
  <button data-l="More"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>More</button>
</nav>
<script>
var arrow='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
var PL=null,PXST=0,PROWS=[],ARMAP={},TP=null,LIST=[],POOL=[],cont=[],moreFn=null,qTok=0,PT=null;
var v=document.getElementById('view'),sub=document.getElementById('sub');
var BACK='<button class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function safe(u){return /^https?:\/\//.test(u||'')?u.replace(/['"()\s<>]/g,function(c){return '%'+c.charCodeAt(0).toString(16)}):''}
function kk(a){return a[5]?' data-k="'+esc(a[5])+'"':''}
function bg(a){var u=safe(a[3]);return u?' style="background:#1c1e21 url('+u+') center/cover"':''}
function lab(a){return safe(a[3])?'':'<b>'+esc(a[0]).toUpperCase()+'</b>'}
function card(a,cls,extra){return '<div class="'+cls+'"><div class="art"'+kk(a)+' tabindex="0"'+bg(a)+'>'+lab(a)+(a[7]?'<i class="unw"></i>':'')+(extra||'')+'</div><div class="cap">'+esc(a[0])+'</div>'+(a[6]?'<div class="yr">'+esc(a[6])+'</div>':'')+'</div>'}
function tall(a){return card(a,'tall')}
function wide(a){return card(a,'wide','<div class="bar"><i style="width:'+(+a[2]||0)+'%"></i></div>')}
function hd(t){return '<div class="hd" role="button" tabindex="0" data-t="'+esc(t)+'"><h2>'+esc(t)+'</h2>'+arrow+'</div>'}
function sec(t,l){return hd(t)+'<div class="row">'+l.map(tall).join('')+'</div>'}
function prows(type){return PROWS.filter(function(r){return !type||r.c.type===type}).map(function(r){return sec(r.t,r.items)}).join('')}
function welcome(){return '<div class="empty">Welcome to Plex Media Hub<p class="note2">Sign in to your Plex account to see your library here.</p><button class="more" id="gosettings">Open Settings</button></div>'}
function plexHome(t){
  if(!PL)return welcome();
  if(PXST===0)return '<p class="note">Loading your Plex library...</p>';
  var r=prows(t);
  if(!t&&cont.length)r=hd('Continue Watching')+'<div class="row">'+cont.map(wide).join('')+'</div>'+r;
  return r||'<p class="note">No Plex libraries found. Check More, Settings.</p>';
}
function show(n){v.innerHTML=plexHome(n==='Movies'?'movie':n==='TV Shows'?'series':undefined)}
function rerender(){var n=document.querySelector('.nav button.on');if(n&&n.dataset.l==='Home'&&sub.hidden)show(document.querySelector('.tab.on').textContent)}
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
  b.classList.add('on');document.querySelectorAll('.nav button').forEach(function(t){t.classList.toggle('on',t.dataset.l==='Home')});show(b.textContent);
});
document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.nav button').forEach(function(t){t.classList.remove('on')});
  b.classList.add('on');closeSub();
  var l=b.dataset.l;
  if(l==='Home')show(document.querySelector('.tab.on').textContent);else if(l==='More')v.innerHTML=settingsPage();else if(l==='My List')v.innerHTML=listPage();else v.innerHTML=discoverPage();
});
function openSub(h){sub.innerHTML='<div class="subin">'+h+'</div>';sub.hidden=false}
function closeSub(){sub.hidden=true;sub.innerHTML='';moreFn=null;qTok++}
function openSection(t){
  var ar=ARMAP[t],wm=t==='Continue Watching',items=(ar?ar.items:(wm?cont:[])).slice(),canMore=!!(ar&&ar.more);
  function draw(){var y=sub.scrollTop;openSub('<div class="subhd">'+BACK+'<h2>'+esc(t)+'</h2></div><div class="grid">'+items.map(wm?wide:tall).join('')+'</div>'+(canMore?'<button class="more">Load more</button>':''));sub.scrollTop=y}
  moreFn=function(){
    var bt=sub.querySelector('.more');if(bt){bt.textContent='Loading...';bt.disabled=true}
    ar.more(items.length).then(function(n){var seen={};items.forEach(function(x){seen[x[5]]=1});n=n.filter(function(x){return !seen[x[5]]});if(!n.length)canMore=false;items=items.concat(n);draw()}).catch(function(){draw()});
  };
  draw();sub.scrollTop=0;
}
function showRes(items,q){var r=document.getElementById('res');if(!r)return;r.innerHTML=items.length?'<div class="grid">'+items.map(tall).join('')+'</div>':'<p class="note">No results for \u201C'+esc(q)+'\u201D.</p>'}
function run(q){
  var tok=++qTok,r=document.getElementById('res');
  if(!q){if(r)r.innerHTML='<p class="note">Type a title to start searching.</p>';return}
  plexSearch(q).then(function(g){if(tok===qTok)showRes(g,q)});
}
function openSearch(){
  openSub('<div class="subhd">'+BACK+'<input id="q" type="search" placeholder="Search your library" autocomplete="off" aria-label="Search"></div><div id="res"><p class="note">Type a title to start searching.</p></div>');
  var q=document.getElementById('q'),tm;q.focus();
  q.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){run(q.value.trim())},300)});
}
sub.addEventListener('click',function(e){if(e.target.closest('.back'))closeSub();else if(e.target.closest('.more')&&moreFn)moreFn()});
v.addEventListener('click',function(e){var h=e.target.closest('.hd');if(h)openSection(h.dataset.t)});
v.addEventListener('keydown',function(e){var h=e.target.closest('.hd');if(h&&e.key==='Enter')openSection(h.dataset.t)});
var sb=document.querySelector('.search');sb.addEventListener('click',openSearch);sb.addEventListener('keydown',function(e){if(e.key==='Enter')openSearch()});
if('serviceWorker' in navigator&&!window.Capacitor&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}

try{PL=JSON.parse(localStorage.getItem('plexmediahub.plex')||'null')}catch(e){}
try{LIST=JSON.parse(localStorage.getItem('plexmediahub.list')||'[]')}catch(e){}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function cid(){var c='';try{c=localStorage.getItem('plexmediahub.cid')||''}catch(e){}if(!c){c='plexmediahub-'+Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('plexmediahub.cid',c)}catch(e){}}return c}
function HX(){return {'Accept':'application/json','X-Plex-Client-Identifier':cid(),'X-Plex-Product':'PlexMediaHub','X-Plex-Version':'1.0','X-Plex-Platform':'Android','X-Plex-Device':'Phone','X-Plex-Device-Name':'PlexMediaHub'}}
function tvj(u,o){return fetch(u,o||{headers:HX()}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function race(p,ms){return Promise.race([p,new Promise(function(_,j){setTimeout(function(){j('t')},ms)})])}
function pget(p,q){return tvj(PL.server.uri+p+(p.indexOf('?')>-1?'&':'?')+(q?q+'&':'')+'X-Plex-Token='+encodeURIComponent(PL.server.token),{headers:HX()})}
function pimg(p,w,h){return p?PL.server.uri+'/photo/:/transcode?width='+w+'&height='+h+'&minSize=1&upscale=1&url='+encodeURIComponent(p)+'&X-Plex-Token='+encodeURIComponent(PL.server.token):''}
function pitem(m){
  var ep=m.type==='episode',t=ep?(m.grandparentTitle||m.title):m.title;
  var s=ep?'S'+m.parentIndex+':E'+m.index:(m.year||'');
  var pr=m.viewOffset&&m.duration?Math.round(m.viewOffset/m.duration*100):0;
  var unw=m.type==='movie'?!m.viewCount:(m.type==='show'?m.unviewedLeafCount>0:false);
  return [String(t),'g1',pr,pimg(ep?(m.grandparentThumb||m.thumb):m.thumb,342,513),(m.Genre||[]).slice(0,3).map(function(g){return g.tag}).join(' \u2022 '),'plex:'+m.ratingKey,String(s),!!unw];
}
function plexBox(){return PL?'<p class="note2">Connected to '+esc(PL.server.name)+'.</p><div class="addrow"><button id="pout">Sign out</button></div>':'<p class="note2">Sign in to play your Plex library inside Plex Media Hub.</p><div class="addrow"><button id="pin">Sign in with Plex</button></div>'}
function settingsPage(){return '<div class="addons"><h2 class="pg">Settings</h2><h3 class="sh">Plex</h3><div id="pbox">'+plexBox()+'</div><div id="pmsg" class="note2" role="status"></div></div>'}
function pmsg(h){var m=document.getElementById('pmsg');if(m)m.innerHTML=h}
function plexSignIn(){
  pmsg('Contacting Plex...');
  tvj('https://plex.tv/api/v2/pins',{method:'POST',headers:HX()}).then(function(p){
    pmsg('On any device, go to <b>plex.tv/link</b> and enter this code: <b style="font-size:22px;letter-spacing:3px">'+esc(p.code)+'</b>');
    var n=0,tm=setInterval(function(){
      if(++n>90){clearInterval(tm);pmsg('That code expired. Try again.');return}
      tvj('https://plex.tv/api/v2/pins/'+p.id+'?code='+encodeURIComponent(p.code),{headers:HX()}).then(function(r){if(r.authToken){clearInterval(tm);plexPick(r.authToken)}}).catch(function(){});
    },2000);
  }).catch(function(){pmsg('Could not reach Plex. Check your connection and try again.')});
}
function tryConn(d,cs,i){
  if(i>=cs.length)return Promise.reject('none');
  return race(tvj(cs[i].uri+'/identity?X-Plex-Token='+encodeURIComponent(d.accessToken),{headers:HX()}),6000).then(function(){return cs[i].uri}).catch(function(){return tryConn(d,cs,i+1)});
}
function plexPick(tok){
  pmsg('Signed in. Looking for your server...');
  var h=HX();h['X-Plex-Token']=tok;
  tvj('https://plex.tv/api/v2/resources?includeHttps=1&includeRelay=1',{headers:h}).then(function(rs){
    var ds=rs.filter(function(d){return (d.provides||'').indexOf('server')>=0&&d.accessToken}).sort(function(a,b){return (b.owned?1:0)-(a.owned?1:0)});
    if(!ds.length)throw 'none';
    var d=ds[0],sc=function(c){return c.relay?3:(c.protocol==='https'?(c.local?1:0):2)};
    var cs=(d.connections||[]).slice().sort(function(a,b){return sc(a)-sc(b)});
    return tryConn(d,cs,0).then(function(uri){
      PL={token:tok,server:{name:d.name,uri:uri.replace(/\/$/,''),token:d.accessToken}};
      try{localStorage.setItem('plexmediahub.plex',JSON.stringify(PL))}catch(e){}
      var b=document.getElementById('pbox');if(b)b.innerHTML=plexBox();
      pmsg('Connected to '+esc(d.name)+'. Loading your libraries...');loadPlex();
    });
  }).catch(function(){pmsg('Signed in, but no reachable Plex server was found. Check that remote access is enabled on your server.')});
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function loadPlex(){
  if(!PL)return;
  pget('/library/sections').then(function(r){
    var ds=(r.MediaContainer.Directory||[]).filter(function(d){return d.type==='movie'||d.type==='show'});
    var jobs=ds.map(function(d){return pget('/library/sections/'+d.key+'/all','sort=addedAt:desc&X-Plex-Container-Start=0&X-Plex-Container-Size=30').then(function(x){return {d:d,items:(x.MediaContainer.Metadata||[]).map(pitem)}}).catch(function(){return null})});
    ds.forEach(function(d){jobs.push(pget('/library/sections/'+d.key+'/all','X-Plex-Container-Start=0&X-Plex-Container-Size=150').then(function(x){return {pool:x.MediaContainer.Metadata||[]}}).catch(function(){return null}))});
    jobs.push(pget('/library/onDeck').then(function(x){return {od:(x.MediaContainer.Metadata||[]).map(pitem)}}).catch(function(){return null}));
    return Promise.all(jobs);
  }).then(function(rs){
    PROWS=[];ARMAP={};cont=[];var POOLR=[];
    rs.forEach(function(x){
      if(!x)return;
      if(x.pool){POOLR=POOLR.concat(x.pool);return}
      if(x.od){cont=x.od;return}
      if(!x.items.length)return;
      var d=x.d,t='Recently Added in '+d.title;
      var row={t:t,items:x.items,c:{type:d.type==='movie'?'movie':'series'},more:function(n){return pget('/library/sections/'+d.key+'/all','sort=addedAt:desc&X-Plex-Container-Start='+n+'&X-Plex-Container-Size=30').then(function(y){return (y.MediaContainer.Metadata||[]).map(pitem)})}};
      PROWS.push(row);ARMAP[t]=row;
    });
    POOL=POOLR.filter(function(m){return m.thumb&&(m.type==='movie'||m.type==='show')}).map(pitem);
    PXST=1;pmsg(PROWS.length?'Your Plex libraries are on the Home page.':'Connected, but no movie or show libraries were found.');
    rerender();
  }).catch(function(){PXST=2;pmsg('Could not load your Plex libraries.');rerender()});
}
function plexSearch(q){if(!PL)return Promise.resolve([]);return pget('/hubs/search','query='+encodeURIComponent(q)+'&limit=12').then(function(r){var o=[],seen={};(r.MediaContainer.Hub||[]).forEach(function(h){if(h.type==='movie'||h.type==='show')(h.Metadata||[]).forEach(function(m){if(!seen[m.ratingKey]){seen[m.ratingKey]=1;o.push(pitem(m))}})});return o}).catch(function(){return []})}
function lkey(a){return a[0]+'|'+(a[5]||'')}
function inList(a){return LIST.some(function(x){return lkey(x)===lkey(a)})}
function toggle(a){var k=lkey(a),i=-1;LIST.forEach(function(x,j){if(lkey(x)===k)i=j});if(i>=0){LIST.splice(i,1);toast('Removed from My List')}else{LIST.push(a);toast('Added to My List')}try{localStorage.setItem('plexmediahub.list',JSON.stringify(LIST))}catch(e){}}
function listPage(){return LIST.length?'<h2 class="pg" style="padding:24px 20px 14px">My List</h2><div class="grid">'+LIST.map(tall).join('')+'</div>':'<div class="empty">My List is empty for now. Titles you add will show up here.</div>'}
function discoverPage(){
  if(!PL)return welcome();
  if(!POOL.length)return '<div class="empty">Nothing to discover yet.</div>';
  return '<h2 class="pg" style="padding:24px 20px 10px">Discover</h2><div class="addrow" style="padding:0 20px 16px"><button id="surp">Surprise me</button><button id="shuf">Shuffle</button></div><div class="grid">'+shuffle(POOL).slice(0,18).map(tall).join('')+'</div>';
}
function openTitle(id){
  openSub('<div class="subhd">'+BACK+'</div><p class="note">Loading...</p>');
  pget('/library/metadata/'+id).then(function(r){
    var m=r.MediaContainer.Metadata[0],isShow=m.type==='show';
    TP=[String(m.title),'g1',0,pimg(m.thumb,342,513),'','plex:'+m.ratingKey,String(m.year||''),false];
    var meta=[m.year,m.contentRating,m.duration?Math.round(m.duration/60000)+' min':'',m.rating?'\u2605 '+m.rating:''].filter(Boolean).map(esc).join(' \u2022 ');
    openSub('<div class="subhd">'+BACK+'</div><div class="tp"><div class="tpart" style="background-image:url('+safe(pimg(m.art||m.thumb,780,440))+')"></div><div class="tpin"><h2>'+esc(m.title)+'</h2><div class="meta">'+meta+'</div><div class="gn">'+esc((m.Genre||[]).slice(0,3).map(function(g){return g.tag}).join(' \u2022 '))+'</div>'+(isShow?'':'<button class="play" data-play="'+esc(id)+'">\u25B6 '+(m.viewOffset?'Resume':'Play')+'</button>')+'<button class="add" data-list="1">'+(inList(TP)?'\u2713 In My List':'+ My List')+'</button><p class="syn">'+esc(m.summary||'')+'</p></div></div><div id="eps"></div>');
    if(isShow)loadSeasons(id);
  }).catch(function(){openSub('<div class="subhd">'+BACK+'</div><p class="note">Could not load this title.</p>')});
}
function loadSeasons(id){
  pget('/library/metadata/'+id+'/children').then(function(r){
    var ss=(r.MediaContainer.Metadata||[]).filter(function(s){return s.type==='season'}),e=document.getElementById('eps');
    if(!e)return;
    e.innerHTML='<div class="seas">'+ss.map(function(s,i){return '<button class="sbtn'+(i?'':' on')+'" data-s="'+esc(s.ratingKey)+'">'+esc(s.title)+'</button>'}).join('')+'</div><div id="eplist"></div>';
    if(ss[0])loadEps(ss[0].ratingKey);
  }).catch(function(){});
}
function loadEps(k){
  pget('/library/metadata/'+k+'/children').then(function(r){
    var l=document.getElementById('eplist');if(!l)return;
    l.innerHTML=(r.MediaContainer.Metadata||[]).map(function(m){return '<div class="ep" tabindex="0" data-play="'+esc(m.ratingKey)+'"><div class="epn">'+esc(m.index||'')+'</div><div class="ept"><b>'+esc(m.title)+'</b><small>'+(m.duration?Math.round(m.duration/60000)+' min':'')+'</small></div>\u25B6</div>'}).join('');
  }).catch(function(){});
}
function playItem(id){
  pget('/library/metadata/'+id).then(function(r){
    var m=r.MediaContainer.Metadata[0],part=m.Media&&m.Media[0]&&m.Media[0].Part&&m.Media[0].Part[0],off=m.viewOffset||0,tk=encodeURIComponent(PL.server.token);
    var hls=PL.server.uri+'/video/:/transcode/universal/start.m3u8?hasMDE=1&path='+encodeURIComponent('/library/metadata/'+id)+'&mediaIndex=0&partIndex=0&protocol=hls&fastSeek=1&directPlay=0&directStream=1&subtitleSize=100&audioBoost=100&location=wan&maxVideoBitrate=8000&offset='+Math.floor(off/1000)+'&session='+encodeURIComponent(cid()+Date.now())+'&X-Plex-Platform=Android&X-Plex-Product=PlexMediaHub&X-Plex-Client-Identifier='+encodeURIComponent(cid())+'&X-Plex-Token='+tk;
    showPlayer(m,hls,part?PL.server.uri+part.key+'?X-Plex-Token='+tk:'',off);
  }).catch(function(){toast('Could not start playback')});
}
function showPlayer(m,hls,direct,off){
  closePlayer();
  var d=document.createElement('div');d.id='player';
  d.innerHTML='<button class="pclose" aria-label="Close player">\u00D7</button><video controls autoplay playsinline></video>';
  document.body.appendChild(d);
  var v2=d.querySelector('video'),mode='hls',tm;
  PT={el:d,v:v2,m:m,base:function(){return mode==='hls'?off:0}};
  function rep(state){if(!PL)return;var ms=Math.round(PT.base()+v2.currentTime*1000);fetch(PL.server.uri+'/:/timeline?ratingKey='+m.ratingKey+'&key='+encodeURIComponent('/library/metadata/'+m.ratingKey)+'&state='+state+'&time='+ms+'&duration='+(m.duration||0)+'&X-Plex-Client-Identifier='+encodeURIComponent(cid())+'&X-Plex-Token='+encodeURIComponent(PL.server.token),{headers:HX()}).catch(function(){})}
  PT.rep=rep;
  v2.addEventListener('error',function(){if(mode==='hls'&&direct){mode='direct';v2.src=direct;v2.load();v2.addEventListener('loadedmetadata',function(){v2.currentTime=off/1000},{once:true});v2.play().catch(function(){})}else toast('This video could not be played')});
  v2.addEventListener('ended',function(){rep('stopped');fetch(PL.server.uri+'/:/scrobble?key='+m.ratingKey+'&identifier=com.plexapp.plugins.library&X-Plex-Token='+encodeURIComponent(PL.server.token),{headers:HX()}).catch(function(){})});
  v2.addEventListener('pause',function(){rep('paused')});
  tm=setInterval(function(){if(!v2.paused)rep('playing')},15000);PT.tm=tm;
  d.querySelector('.pclose').addEventListener('click',closePlayer);
  v2.src=hls;
}
function closePlayer(){if(!PT)return;try{PT.rep('stopped')}catch(e){}clearInterval(PT.tm);try{PT.v.pause();PT.v.removeAttribute('src');PT.v.load()}catch(e){}PT.el.remove();PT=null}
function hit(e){
  var t=e.target,a=t.closest('.art[data-k]');
  if(a&&a.dataset.k.indexOf('plex:')===0){if(PL)openTitle(a.dataset.k.slice(5));return}
  var p=t.closest('[data-play]');if(p){playItem(p.dataset.play);return}
  var l=t.closest('[data-list]');if(l&&TP){toggle(TP);l.textContent=inList(TP)?'\u2713 In My List':'+ My List';return}
  var s=t.closest('.sbtn');if(s){document.querySelectorAll('.sbtn').forEach(function(x){x.classList.remove('on')});s.classList.add('on');loadEps(s.dataset.s);return}
  if(t.closest('#shuf')){v.innerHTML=discoverPage();return}
  if(t.closest('#surp')){if(POOL.length)openTitle(POOL[Math.floor(Math.random()*POOL.length)][5].slice(5));return}
  if(t.closest('#gosettings')){document.querySelector('.nav button[data-l="More"]').click();return}
  if(t.closest('#pin')){plexSignIn();return}
  if(t.closest('#pout')){try{localStorage.removeItem('plexmediahub.plex')}catch(x){}location.reload()}
}
v.addEventListener('click',hit);sub.addEventListener('click',hit);
function focusables(){
  var els=[];function add(r){Array.prototype.forEach.call(r.querySelectorAll('button,[tabindex="0"],input,[role=button]'),function(e){if(e.disabled)return;var b=e.getBoundingClientRect();if(b.width>0&&b.height>0)els.push(e)})}
  if(!sub.hidden){add(sub);add(document.getElementById('nav'))}else add(document);
  return els;
}
function move(dir){
  var list=focusables(),cur=document.activeElement,navEl=document.getElementById('nav');
  var inNav=function(e){return navEl.contains(e)};
  if(!cur||list.indexOf(cur)<0){var f=list.filter(function(e){return !inNav(e)&&e.closest('.row,.grid')})[0]||list[0];if(f)f.focus();return}
  var c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2,best=null,bs=1e9,fromNav=inNav(cur);
  var navTop=navEl.getBoundingClientRect().top;
  list.forEach(function(e){
    if(e===cur||inNav(e))return;
    var r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy,d,p;
    if(fromNav){if(dir!=='U')return;if(r.bottom>navTop||r.bottom<0)return;d=navTop-r.bottom;p=Math.abs(dx)}
    else if(dir==='L'&&dx<-2){d=-dx;p=Math.abs(dy)}else if(dir==='R'&&dx>2){d=dx;p=Math.abs(dy)}else if(dir==='U'&&dy<-2){d=-dy;p=Math.abs(dx)}else if(dir==='D'&&dy>2){d=dy;p=Math.abs(dx)}else return;
    var sc=d+p*3;if(sc<bs){bs=sc;best=e}
  });
  if(fromNav&&(dir==='L'||dir==='R')){
    var nb=Array.prototype.slice.call(navEl.querySelectorAll('button')),i=nb.indexOf(cur)+(dir==='R'?1:-1);
    if(nb[i])nb[i].focus();return;
  }
  if(!best&&!fromNav&&dir==='D'){var nbtn=navEl.querySelector('button.on')||navEl.querySelector('button');if(nbtn)nbtn.focus();return}
  if(best){best.focus();best.scrollIntoView({block:'center',inline:'center'})}
}
document.addEventListener('keydown',function(e){
  var k=e.key,t=e.target;
  if(PT){
    var vv=PT.v;
    if(k==='Enter'||k===' '||k==='MediaPlayPause'){e.preventDefault();if(vv.paused)vv.play();else vv.pause();return}
    if(k==='ArrowLeft'||k==='MediaRewind'){e.preventDefault();vv.currentTime=Math.max(0,vv.currentTime-10);return}
    if(k==='ArrowRight'||k==='MediaFastForward'){e.preventDefault();vv.currentTime=vv.currentTime+10;return}
    return;
  }
  var dir={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[k];
  if(dir){if(t&&t.tagName==='INPUT'&&(dir==='L'||dir==='R'))return;e.preventDefault();move(dir);return}
  if((k==='Enter'||e.keyCode===23)&&t&&t.matches&&t.matches('.art,.ep')){e.preventDefault();t.click()}
});
try{
  var CAP=window.Capacitor,APP=CAP&&CAP.Plugins&&CAP.Plugins.App;
  if(APP)APP.addListener('backButton',function(){
    if(PT){closePlayer();return}
    if(!sub.hidden){closeSub();return}
    var n=document.querySelector('.nav button.on');
    if(n&&n.dataset.l!=='Home'){document.querySelector('.nav button[data-l="Home"]').click();return}
    var t=document.querySelector('.tab.on');
    if(t&&t.textContent!=='Home'){document.querySelector('.tab').click();return}
    APP.exitApp();
  });
}catch(e){}
show('Home');
loadPlex();
</script>
